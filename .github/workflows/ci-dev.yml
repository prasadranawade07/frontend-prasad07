name: Frontend CI/CD (Development)

on:
  workflow_dispatch:

  push:
    branches:
      - dev

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy Frontend
    runs-on: ubuntu-latest

    environment: Development

    env:
      TFSTATE_BUCKET: prasad-terraform-state-bucket-2026
      TFSTATE_KEY: frontend/webapp/dev/terraform.tfstate

    steps:

      ############################################################
      # CHECKOUT
      ############################################################

      - name: Checkout Repository
        uses: actions/checkout@v4

      ############################################################
      # GITHUB DEBUG
      ############################################################

      - name: GitHub Context
        run: |
          echo "Repository      : $GITHUB_REPOSITORY"
          echo "Repository Owner: $GITHUB_REPOSITORY_OWNER"
          echo "Branch          : $GITHUB_REF_NAME"
          echo "Ref             : $GITHUB_REF"
          echo "Actor           : $GITHUB_ACTOR"
          echo "Workflow        : $GITHUB_WORKFLOW"
          echo "Run ID          : $GITHUB_RUN_ID"
          echo "Environment     : ${{ github.environment }}"
          echo "Job             : ${{ github.job }}"

      ############################################################
      # DUMP OIDC CLAIMS
      ############################################################

      - name: Dump OIDC Claims
        uses: actions/github-script@v7
        with:
          script: |
            const core = require('@actions/core');

            const token = await core.getIDToken("sts.amazonaws.com");

            const payload = JSON.parse(
              Buffer.from(token.split(".")[1], "base64").toString()
            );

            console.log("======================================");
            console.log("OIDC TOKEN CLAIMS");
            console.log("======================================");
            console.log(JSON.stringify(payload, null, 2));

      ############################################################
      # PRINT VARIABLES
      ############################################################

      - name: Print Variables
        run: |
          echo "AWS Region : ${{ vars.AWS_REGION }}"
          echo "Role ARN   : ${{ secrets.AWS_ROLE_ARN }}"
          echo "Bucket     : $TFSTATE_BUCKET"
          echo "State Key  : $TFSTATE_KEY"

      ############################################################
      # CONFIGURE AWS
      ############################################################

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-actions-frontend

      ############################################################
      # VERIFY AWS LOGIN
      ############################################################

      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity
          aws configure list

      ############################################################
      # DOWNLOAD TF STATE
      ############################################################

      - name: Download Terraform State
        run: |
          aws s3 cp \
            s3://$TFSTATE_BUCKET/$TFSTATE_KEY \
            terraform.tfstate

      ############################################################
      # READ OUTPUTS
      ############################################################

      - name: Read Outputs
        run: |
          echo "S3_BUCKET_NAME=$(jq -r '.outputs.bucket_name.value' terraform.tfstate)" >> $GITHUB_ENV
          echo "CLOUDFRONT_DISTRIBUTION_ID=$(jq -r '.outputs.cloudfront_distribution_id.value' terraform.tfstate)" >> $GITHUB_ENV
          echo "FRONTEND_URL=$(jq -r '.outputs.frontend_url.value' terraform.tfstate)" >> $GITHUB_ENV

      ############################################################
      # DEPLOY
      ############################################################

      - name: Upload Frontend
        run: |
          aws s3 sync frontend/ s3://$S3_BUCKET_NAME --delete

      ############################################################
      # INVALIDATE CLOUDFRONT
      ############################################################

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id $CLOUDFRONT_DISTRIBUTION_ID \
            --paths "/*"

      ############################################################
      # SUMMARY
      ############################################################

      - name: Deployment Summary
        run: |
          echo "Deployment Complete"
          echo "Bucket      : $S3_BUCKET_NAME"
          echo "Distribution: $CLOUDFRONT_DISTRIBUTION_ID"
          echo "Frontend URL: $FRONTEND_URL"
